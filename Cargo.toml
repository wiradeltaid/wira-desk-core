[package]
name = "wiradesk-core"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic, sans-IO core domain engine for Wira Desk"
license = "MIT"
repository = "https://github.com/wiradeltaid/wira-desk-core"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
